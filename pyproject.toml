[project]
name = "arda-raset"
version = "0.1.0"
description = "arda-radar + arda-servo + thermal-camera 단일 프로세스 통합 실행 프로그램"
readme = "README.md"
# jetson-ai-lab 인덱스의 torch==2.11.0(--extra yolo, 아래)이 cp310 wheel만
# 제공해서 3.10으로 고정한다 — arda-radar 자체 pyproject는 >=3.12를 선언하지만
# arda-raset은 그 저장소를 pip 의존성이 아니라 sys.path로 직접 import하므로
# (main.py 참고) 그 선언이 강제되지 않고, 코드에도 3.12 전용 문법은 없다.
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "Jetson.GPIO>=2.1.0; platform_machine == 'aarch64'",
    "Adafruit-Blinka==9.1.0",
    "adafruit-circuitpython-mlx90640==1.3.9",
    "opencv-python==5.0.0.93",
]

[project.optional-dependencies]
# thermal-camera의 커스텀 YOLO 판정 백엔드(--yolo)용. torch/torchvision은 아래
# jetson-ai-lab 인덱스로 고정 — 일반 PyPI wheel은 이 Jetson(L4T) 보드에서
# CUDA를 못 잡는다(thermal-camera/README.md 23장 참고). 설치 후 CUDA가 여전히
# 안 잡히면 thermal-camera/fix_cuda_cudss.sh도 참고할 것.
yolo = ["ultralytics>=8.3,<9", "torch==2.11.0", "torchvision==0.26.0"]

[[tool.uv.index]]
name = "jetson-ai-lab"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "jetson-ai-lab" }
torchvision = { index = "jetson-ai-lab" }
